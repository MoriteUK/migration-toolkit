<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLY TechTeam Report</title>
<style>
:root{
  --bg:#eef1f3; --paper:#fff; --fg:#16202a; --muted:#5b6771; --line:#dfe4e8; --accent:#0f6b78; --accent-bg:#e3f1f3;
  --err:#b3261e; --err-bg:#fbe4e2; --warn:#9a6200; --warn-bg:#fbf0d9; --sec:#6b3fa0; --sec-bg:#efe7f8; --info:#5b6771; --info-bg:#eceff1; --ok:#1f7a4d; --ok-bg:#e2f3ea;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif; --mono:Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--body)}
header{background:var(--fg);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;font-weight:600}
header .meta{font-size:.8rem;opacity:.75}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 52px)}
nav{background:var(--paper);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;color:var(--fg);text-decoration:none}
nav a:hover{background:var(--bg)} nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
nav .sub{font-size:.72rem;color:var(--muted);font-weight:400}
main{padding:18px 22px;min-width:0}
h2{font-size:1.15rem;margin:0 0 4px} h3{font-size:.95rem;margin:18px 0 8px}
.crumbs{font-size:.8rem;color:var(--muted);margin-bottom:10px} .crumbs a{color:var(--accent);text-decoration:none} .crumbs a:hover{text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.card b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums} .card span{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 10px}
.tabs a{padding:7px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line)}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:7px 8px;border-bottom:2px solid var(--line);background:#f7f9fa;position:sticky;top:0;cursor:pointer;user-select:none}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:#f3f8f9}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.78rem}
.muted{color:var(--muted)} .small{font-size:.76rem}
.pill{display:inline-block;font:600 .66rem var(--body);text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.pill.Error{color:var(--err);background:var(--err-bg)} .pill.Warning{color:var(--warn);background:var(--warn-bg)}
.pill.Security{color:var(--sec);background:var(--sec-bg)} .pill.Info{color:var(--info);background:var(--info-bg)} .pill.ok{color:var(--ok);background:var(--ok-bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 10px}
.filters input,.filters select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
.filters input[type=search]{min-width:280px;flex:1}
.note{background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:4px;font-size:.8rem;margin:8px 0}
.more{margin:10px 0}
button{font:600 .8rem var(--body);padding:6px 12px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.wrap{word-break:break-word}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--err);vertical-align:middle}
header .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem}
header .tools label{display:flex;gap:5px;align-items:center;cursor:pointer}
header .tools button{background:transparent;border-color:#ffffff66}
tr.marked td{opacity:.55}
select.mark{font:inherit;font-size:.76rem;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:#fff}
input.tnote{font:inherit;font-size:.76rem;padding:3px 6px;border:1px solid var(--line);border-radius:4px;margin-top:4px;width:100%;min-width:140px}
@media (max-width:800px){.shell{grid-template-columns:1fr} nav{flex-direction:row;overflow-x:auto}}
</style>
</head>
<body>
<header><div><h1 id="title">FLY TechTeam Report</h1><div class="meta" id="meta"></div></div><div class="tools"><label><input type="checkbox" id="showMarked"> Show fixed &amp; ignored</label><button id="exportMarks" title="Save your Fixed / Ignored marks to a file to share with the team">Export marks</button><button id="importMarks" title="Load marks exported by a colleague">Import marks</button><input type="file" id="importFile" accept=".json" hidden><button id="exportCsv" title="Open (not fixed / ignored) items as CSV">Export open issues (CSV)</button></div></header>
<div class="shell"><nav id="nav"></nav><main id="main"></main></div>
<script>
var DATA = /*__DATA__*/null;
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var n0 = function (v) { return v == null ? '–' : Math.round(v).toLocaleString('en-GB'); };
  var SEVS = ['Error', 'Warning', 'Security', 'Info'];
  var SEV_HELP = { Error: 'failed', Warning: 'migrated with problems', Security: 'security exposure carried over', Info: 'not supported / informational' };
  if (!DATA) { $('main').innerHTML = '<p>No data in this report.</p>'; return; }
  document.title = DATA.client + ' - FLY TechTeam Report';
  $('title').textContent = DATA.client + ' – FLY TechTeam Report';
  $('meta').textContent = 'Generated ' + new Date(DATA.generated).toLocaleString('en-GB') + ' · successful and skipped items are not listed';
  var byWl = {}; DATA.areas.forEach(function (A) { byWl[A.id] = A; });
  var openMappings = function (A) { return A.mappings.filter(function (m) { return !/^(Finished|Successful|Completed)$/i.test(m.status); }).length; };

  // ---------- Fixed / Ignored marks ----------
  // Kept in this browser (localStorage, per customer) and keyed by area + FLY error code (+ user + item),
  // so they still apply after the report is regenerated. Export / Import shares them with the team.
  var STORE = 'flyTechMarks:' + DATA.client.toLowerCase();
  var marks = (function () { try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch (e) { return null; } })() || { types: {}, items: {} };
  // "Ignored everywhere": an expected error code (e.g. EX-UserNotInMapping when one domain is split into many)
  // applies to every area and every customer's report in this browser
  var GSTORE = 'flyTechMarks:*';
  var gmarks = (function () { try { return JSON.parse(localStorage.getItem(GSTORE)) || null; } catch (e) { return null; } })() || { codes: {} };
  var showMarked = localStorage.getItem(STORE + ':show') === '1';
  function save() { try { localStorage.setItem(STORE, JSON.stringify(marks)); localStorage.setItem(GSTORE, JSON.stringify(gmarks)); } catch (e) { alert('Could not save marks in this browser: ' + e.message); } }
  var hash = function (s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  var typeKey = function (A, g) { return A.id + '|' + g.key; };
  var itemKey = function (A, it) { return typeKey(A, A.groups[it[0]]) + '|' + hash(A.owners[it[1]].label + '|' + it[2] + '|' + it[4]); };
  var typeMark = function (A, g) { return marks.types[typeKey(A, g)] || (gmarks.codes[g.key] ? Object.assign({ all: true }, gmarks.codes[g.key]) : null); };
  // state of an item: its own mark, else its issue type's mark (inherited), else open
  function itemState(A, it) {
    var own = marks.items[itemKey(A, it)]; if (own) return { s: own.s, own: true };
    var t = typeMark(A, A.groups[it[0]]); return t ? { s: t.s, own: false } : { s: 'open', own: false };
  }
  function setType(A, g, s) {
    var k = typeKey(A, g), prev = marks.types[k] || gmarks.codes[g.key] || {};
    delete marks.types[k]; delete gmarks.codes[g.key];
    var m = { s: s === 'ignored-all' ? 'ignored' : s, at: new Date().toISOString(), code: g.code || g.kind, note: prev.note || '' };
    if (s === 'ignored-all') gmarks.codes[g.key] = m; else if (s !== 'open') marks.types[k] = m;
    save();
  }
  function setNote(A, g, note) { var k = typeKey(A, g); if (marks.types[k]) marks.types[k].note = note; else if (gmarks.codes[g.key]) gmarks.codes[g.key].note = note; save(); }
  function setItem(A, it, s) { var k = itemKey(A, it); if (s === 'open' || s === 'inherit') delete marks.items[k]; else marks.items[k] = { s: s, at: new Date().toISOString() }; save(); }

  // open (not fixed / ignored) counts. Items beyond the per-type cap follow their type's mark.
  var cache = {};
  function stats(A) {
    if (cache[A.id]) return cache[A.id];
    var gOpen = A.groups.map(function (g) { return typeMark(A, g) ? 0 : g.n; });
    var oOpen = A.owners.map(function () { return { Error: 0, Warning: 0, Security: 0, Info: 0, n: 0 }; });
    A.groups.forEach(function (g, gi) { if (!typeMark(A, g)) g.top.forEach(function (t) { oOpen[t[0]][g.sev] += t[1]; oOpen[t[0]].n += t[1]; }); });
    A.items.forEach(function (it) {
      var g = A.groups[it[0]];
      if (!typeMark(A, g) && marks.items[itemKey(A, it)]) { gOpen[it[0]]--; oOpen[it[1]][g.sev]--; oOpen[it[1]].n--; }
    });
    var c = { Error: 0, Warning: 0, Security: 0, Info: 0 }, marked = 0;
    A.groups.forEach(function (g, gi) { c[g.sev] += gOpen[gi]; marked += g.n - gOpen[gi]; });
    return (cache[A.id] = { gOpen: gOpen, oOpen: oOpen, c: c, open: c.Error + c.Warning + c.Security + c.Info, marked: marked });
  }
  function changed() { cache = {}; }

  var markSel = function (cls, cur, inherit, everywhere) {
    return '<select class="mark ' + cls + '">' + (inherit ? '<option value="inherit"' + (cur === 'inherit' ? ' selected' : '') + '>' + inherit + '</option>' : '') +
      [['open', 'Open'], ['fixed', 'Fixed'], ['ignored', everywhere ? 'Ignored (this area)' : 'Ignored']].concat(everywhere ? [['ignored-all', 'Ignored everywhere']] : []).map(function (o) { return '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
  };
  var stateTag = function (s) { return s === 'fixed' ? '<span class="pill ok">Fixed</span>' : s === 'ignored' ? '<span class="pill Info">Ignored</span>' : ''; };

  function navHtml(cur) {
    var h = '<a href="#/" class="' + (!cur ? 'on' : '') + '"><span>Overview</span></a>';
    DATA.areas.forEach(function (A) {
      var S = stats(A);
      h += '<a href="#/a/' + A.id + '/types" class="' + (cur === A.id ? 'on' : '') + '"><span>' + esc(A.title) + '<br><span class="sub">' + esc(A.source) + '</span></span>' +
        (S.c.Error ? '<span class="pill Error">' + n0(S.c.Error) + '</span>' : S.open ? '<span class="pill Warning">' + n0(S.open) + '</span>' : '<span class="pill ok">0</span>') + '</a>';
    });
    return h;
  }
  function sevPills(c) { return SEVS.filter(function (s) { return c[s]; }).map(function (s) { return '<span class="pill ' + s + '" title="' + SEV_HELP[s] + '">' + n0(c[s]) + ' ' + s + '</span>'; }).join(' ') || '<span class="pill ok">nothing open</span>'; }

  // ---------- views ----------
  function overview() {
    var h = '<h2>All areas</h2><p class="muted">Click an area to see its issue types, the users and sites affected, and the individual items. Mark issue types or items as <b>Fixed</b> or <b>Ignored</b> (expected, can\'t be fixed) as you work through them; counts show what is still open.</p>';
    h += '<table><thead><tr><th>Area</th><th>Source</th><th class="n">Mappings</th><th class="n">Not finished cleanly</th><th>Open issues</th><th class="n">Fixed / ignored</th><th>Biggest open issue types</th></tr></thead><tbody>';
    DATA.areas.forEach(function (A) {
      var S = stats(A);
      var top = A.groups.map(function (g, i) { return { g: g, n: S.gOpen[i] }; }).filter(function (x) { return x.n; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 3)
        .map(function (x) { return esc(x.g.code || x.g.kind) + ' <span class="muted">(' + n0(x.n) + ')</span>'; }).join('<br>');
      h += '<tr class="click" data-go="#/a/' + A.id + '/types"><td><b>' + esc(A.title) + '</b></td><td class="small muted">' + esc(A.source) + '</td><td class="n">' + n0(A.mappings.length) + '</td><td class="n">' + n0(openMappings(A)) + '</td><td>' + sevPills(S.c) + '</td><td class="n">' + (S.marked ? n0(S.marked) : '–') + '</td><td class="small">' + (top || '–') + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function areaHead(A, tab) {
    var S = stats(A);
    var h = '<div class="crumbs"><a href="#/">All areas</a> › ' + esc(A.title) + '</div><h2>' + esc(A.title) + '</h2><div class="muted small">' + esc(A.source) + '</div>';
    h += '<div class="cards">' + SEVS.map(function (s) { return '<div class="card"><b>' + n0(S.c[s]) + '</b><span>open ' + s + ' – ' + SEV_HELP[s] + '</span></div>'; }).join('') +
      '<div class="card"><b>' + n0(S.marked) + '</b><span>fixed or ignored</span></div>' +
      '<div class="card"><b>' + n0(openMappings(A)) + ' / ' + n0(A.mappings.length) + '</b><span>mappings not finished cleanly</span></div></div>';
    if (A.capped) h += '<div class="note">' + n0(A.capped) + ' items are not listed individually because their issue type has more than the per-type limit. The counts include them (and follow the issue type\'s Fixed / Ignored mark); FLY\'s report has the full list.</div>';
    h += '<div class="tabs">' + [['types', 'Issue types (' + A.groups.length + ')'], ['users', 'Users & sites (' + A.owners.filter(function (o) { return o.n; }).length + ')'], ['mappings', 'Mappings (' + A.mappings.length + ')'], ['items', 'All items']]
      .map(function (t) { return '<a href="#/a/' + A.id + '/' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + t[1] + '</a>'; }).join('') + '</div>';
    return h;
  }

  function types(A) {
    var S = stats(A);
    var gs = A.groups.map(function (g, i) { return { g: g, i: i, m: typeMark(A, g) }; })
      .sort(function (a, b) { return (a.m ? 1 : 0) - (b.m ? 1 : 0) || SEVS.indexOf(a.g.sev) - SEVS.indexOf(b.g.sev) || b.g.n - a.g.n; });
    var hidden = gs.filter(function (x) { return x.m; }).length;
    var h = areaHead(A, 'types');
    if (hidden && !showMarked) h += '<p class="small muted">' + hidden + ' fixed / ignored issue ' + (hidden === 1 ? 'type is' : 'types are') + ' hidden – tick <i>Show fixed &amp; ignored</i> at the top to see ' + (hidden === 1 ? 'it' : 'them') + '.</p>';
    h += '<table><thead><tr><th>Severity</th><th>Kind</th><th>Error code</th><th>What FLY reported (example)</th><th class="n">Open items</th><th class="n">Users / sites</th><th>Status &amp; note</th></tr></thead><tbody>';
    gs.forEach(function (x) {
      if (x.m && !showMarked) return;
      var g = x.g, st = x.m ? x.m.s : 'open';
      h += '<tr class="click' + (x.m ? ' marked' : '') + '" data-go="#/a/' + A.id + '/g/' + x.i + '"><td><span class="pill ' + g.sev + '">' + g.sev + '</span></td><td>' + esc(g.kind) + '</td><td class="mono">' + esc(g.code || '–') + '</td><td class="wrap">' + esc(g.msg) + '</td>' +
        '<td class="n">' + n0(S.gOpen[x.i]) + (S.gOpen[x.i] !== g.n ? '<div class="small muted">of ' + n0(g.n) + '</div>' : '') + '</td><td class="n">' + n0(g.users) + '</td>' +
        '<td class="nogo" data-g="' + x.i + '">' + markSel('tmark', x.m && x.m.all ? 'ignored-all' : st, null, true) + (x.m && x.m.all ? '<div class="small muted">all areas &amp; customers</div>' : '') + (x.m ? '<input class="tnote" type="text" placeholder="Note (why)" value="' + esc(x.m.note || '') + '">' : '') + '</td></tr>';
    });
    return h + (gs.length ? '' : '<tr><td colspan="7" class="muted">No issues recorded for this area.</td></tr>') + '</tbody></table>';
  }

  function users(A) {
    var S = stats(A);
    var rows = A.owners.map(function (o, i) { return { o: o, i: i, c: S.oOpen[i] }; }).filter(function (p) { return p.o.n && (showMarked || p.c.n > 0); })
      .sort(function (a, b) { return b.c.Error - a.c.Error || b.c.n - a.c.n; });
    var h = areaHead(A, 'users') + '<div class="filters"><input type="search" id="q" placeholder="Filter users / sites…"></div>';
    h += '<table><thead><tr><th>User / site</th><th>Mapping status</th><th class="n">Open errors</th><th class="n">Warnings</th><th class="n">Security</th><th class="n">Info</th><th class="n">Open total</th><th class="n">All issues</th></tr></thead><tbody id="rows">';
    rows.forEach(function (p) {
      var m = p.o.mapping != null ? A.mappings[p.o.mapping] : null;
      h += '<tr class="click' + (p.c.n ? '' : ' marked') + '" data-go="#/a/' + A.id + '/o/' + p.i + '" data-text="' + esc(p.o.label.toLowerCase()) + '"><td class="wrap">' + esc(p.o.label) + '</td><td class="small">' + esc(m ? m.status : '–') + '</td>' +
        SEVS.map(function (s) { return '<td class="n">' + (p.c[s] > 0 ? n0(p.c[s]) : '<span class="muted">–</span>') + '</td>'; }).join('') + '<td class="n"><b>' + n0(Math.max(0, p.c.n)) + '</b></td><td class="n muted">' + n0(p.o.n) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function mappings(A) {
    var h = areaHead(A, 'mappings') + '<div class="filters"><input type="search" id="q" placeholder="Filter mappings…"></div><table><thead><tr><th>Source</th><th>Destination</th><th>Last job status</th><th class="n">GB</th><th class="n">Successful</th><th class="n">With exceptions</th><th class="n">Errors</th><th>Last job</th><th>Comment</th></tr></thead><tbody id="rows">';
    A.mappings.slice().sort(function (a, b) { return (/^(Finished|Successful|Completed)$/i.test(a.status) ? 1 : 0) - (/^(Finished|Successful|Completed)$/i.test(b.status) ? 1 : 0) || b.err - a.err; }).forEach(function (m) {
      var oi = A.owners.findIndex(function (o) { return o.mapping === A.mappings.indexOf(m); });
      h += '<tr' + (oi >= 0 ? ' class="click" data-go="#/a/' + A.id + '/o/' + oi + '"' : '') + ' data-text="' + esc((m.src + ' ' + m.dst + ' ' + m.status).toLowerCase()) + '"><td class="wrap">' + esc(m.src) + '</td><td class="wrap small muted">' + esc(m.dst) + '</td><td class="small">' + esc(m.status) + '</td><td class="n">' + (m.gb ? m.gb.toFixed(1) : '–') + '</td><td class="n">' + n0(m.ok) + '</td><td class="n">' + n0(m.exc) + '</td><td class="n">' + n0(m.err) + '</td><td class="small muted">' + esc(m.start) + '</td><td class="small wrap">' + esc(m.comment) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  var PAGE = 300;
  function items(A, filt) {
    var title = 'All items', crumb = '', S = stats(A);
    if (filt.g != null) { var g = A.groups[filt.g]; title = (g.code || g.kind) + ' – ' + n0(S.gOpen[filt.g]) + ' open of ' + n0(g.n) + ' items, ' + n0(g.users) + ' users / sites'; crumb = '<a href="#/a/' + A.id + '/types">Issue types</a> › ' + esc(g.code || g.kind); }
    if (filt.o != null) { var o = A.owners[filt.o]; title = o.label + ' – ' + n0(Math.max(0, S.oOpen[filt.o].n)) + ' open of ' + n0(o.n) + ' items'; crumb = '<a href="#/a/' + A.id + '/users">Users & sites</a> › ' + esc(o.label); }
    var h = '<div class="crumbs"><a href="#/">All areas</a> › <a href="#/a/' + A.id + '/types">' + esc(A.title) + '</a>' + (crumb ? ' › ' + crumb : '') + '</div>';
    h += filt.g == null && filt.o == null ? areaHead(A, 'items') : '<h2 class="wrap">' + esc(title) + '</h2>';
    if (filt.g != null) {
      var G = A.groups[filt.g], m = typeMark(A, G);
      h += '<p class="wrap"><span class="pill ' + G.sev + '">' + G.sev + '</span> ' + esc(G.msg) + '</p>' +
        '<div class="filters" data-g="' + filt.g + '"><b class="small">This whole issue type:</b> ' + markSel('tmark', m ? (m.all ? 'ignored-all' : m.s) : 'open', null, true) + (m ? '<input class="tnote" type="text" placeholder="Note (why)" value="' + esc(m.note || '') + '" style="min-width:320px">' : '') + '</div>' +
        (G.kept < G.n ? '<div class="note">Listing the first ' + n0(G.kept) + ' of ' + n0(G.n) + ' items of this type. The rest are in FLY\'s migration report; a Fixed / Ignored mark on the issue type covers them too.</div>' : '');
    }
    h += '<div class="filters"><input type="search" id="q" placeholder="Search item, user, path or message…"><select id="sev"><option value="">All severities</option>' + SEVS.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select>' +
      '<select id="kind"><option value="">All kinds</option>' + Object.keys(A.groups.reduce(function (m, g) { m[g.kind] = 1; return m; }, {})).map(function (k) { return '<option>' + esc(k) + '</option>'; }).join('') + '</select><span class="muted small" id="count"></span></div>';
    h += '<table><thead><tr><th>Severity</th>' + (filt.o == null ? '<th>User / site</th>' : '') + '<th>Item</th><th>Details</th><th>FLY status</th><th>Error code</th><th>FLY message</th><th>Mark</th></tr></thead><tbody id="rows"></tbody></table><div class="more" id="more"></div>';
    return h;
  }
  function fillItems(A, filt) {
    var q = ($('q').value || '').toLowerCase(), sev = $('sev').value, kind = $('kind').value, limit = PAGE, hiddenMarked = 0;
    var list = A.items.filter(function (it) {
      var g = A.groups[it[0]];
      if (filt.g != null && it[0] !== filt.g) return false;
      if (filt.o != null && it[1] !== filt.o) return false;
      if (sev && g.sev !== sev) return false;
      if (kind && g.kind !== kind) return false;
      if (q && (it[2] + ' ' + it[3] + ' ' + it[4] + ' ' + A.owners[it[1]].label + ' ' + A.msgs[it[6]] + ' ' + g.code).toLowerCase().indexOf(q) < 0) return false;
      if (!showMarked && itemState(A, it).s !== 'open') { hiddenMarked++; return false; }
      return true;
    });
    function render() {
      $('rows').innerHTML = list.slice(0, limit).map(function (it, idx) {
        var g = A.groups[it[0]], st = itemState(A, it);
        var sel = st.own ? markSel('imark', st.s, 'As issue type') : markSel('imark', 'inherit', st.s === 'open' ? 'Open' : 'As issue type (' + st.s + ')');
        return '<tr class="' + (st.s !== 'open' ? 'marked' : '') + '" data-i="' + A.items.indexOf(it) + '"><td><span class="pill ' + g.sev + '">' + g.sev + '</span> ' + stateTag(st.s) + '</td>' + (filt.o == null ? '<td class="wrap small"><a href="#/a/' + A.id + '/o/' + it[1] + '">' + esc(A.owners[it[1]].label) + '</a></td>' : '') +
          '<td class="wrap"><b>' + esc(it[2]) + '</b><div class="small muted wrap">' + esc(it[4]) + '</div></td><td class="small">' + esc(g.kind) + (it[3] ? '<br>' + esc(it[3]) : '') + '</td><td class="small">' + esc(it[5]) + '</td>' +
          '<td class="mono"><a href="#/a/' + A.id + '/g/' + it[0] + '">' + esc(g.code || '–') + '</a></td><td class="small wrap">' + esc(A.msgs[it[6]]) + '</td><td>' + sel + '</td></tr>';
      }).join('') || '<tr><td colspan="8" class="muted">No open items match.</td></tr>';
      $('count').textContent = 'Showing ' + n0(Math.min(limit, list.length)) + ' of ' + n0(list.length) + ' items' + (hiddenMarked ? ' · ' + n0(hiddenMarked) + ' fixed / ignored hidden' : '');
      $('more').innerHTML = list.length > limit ? '<button id="moreBtn">Show ' + n0(Math.min(PAGE, list.length - limit)) + ' more</button>' : '';
      if ($('moreBtn')) $('moreBtn').onclick = function () { limit += PAGE; render(); };
      $('rows').querySelectorAll('select.imark').forEach(function (s) {
        s.addEventListener('change', function () {
          var it = A.items[+s.closest('tr').getAttribute('data-i')]; setItem(A, it, s.value); changed();
          var keepScroll = window.scrollY; refresh(); window.scrollTo(0, keepScroll);
        });
      });
    }
    render();
  }

  // ---------- toolbar: show marked, export / import marks, CSV of open issues ----------
  function download(name, text, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  var safeName = DATA.client.replace(/[^\w.-]+/g, '_');
  $('showMarked').checked = showMarked;
  $('showMarked').addEventListener('change', function () { showMarked = this.checked; localStorage.setItem(STORE + ':show', showMarked ? '1' : '0'); refresh(); });
  $('exportMarks').addEventListener('click', function () {
    download(safeName + '_TechTeam_marks.json', JSON.stringify({ client: DATA.client, exported: new Date().toISOString(), marks: marks, everywhere: gmarks }, null, 1), 'application/json');
  });
  $('importMarks').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    var f = this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result), m = d.marks || d, nt = 0, ni = 0;
        Object.keys(m.types || {}).forEach(function (k) { marks.types[k] = m.types[k]; nt++; });
        Object.keys(m.items || {}).forEach(function (k) { marks.items[k] = m.items[k]; ni++; });
        Object.keys((d.everywhere || {}).codes || {}).forEach(function (k) { gmarks.codes[k] = d.everywhere.codes[k]; nt++; });
        save(); changed(); refresh();
        alert('Imported ' + nt + ' issue-type marks and ' + ni + ' item marks' + (d.client && d.client !== DATA.client ? ' (exported from ' + d.client + ')' : '') + '.');
      } catch (e) { alert('That file is not a TechTeam marks export: ' + e.message); }
    };
    r.readAsText(f); this.value = '';
  });
  $('exportCsv').addEventListener('click', function () {
    var q = function (s) { s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    var rows = [['Area', 'Severity', 'Kind', 'Error code', 'User / site', 'Item', 'Details', 'Path', 'FLY status', 'FLY message']];
    DATA.areas.forEach(function (A) {
      A.items.forEach(function (it) {
        if (itemState(A, it).s !== 'open') return;
        var g = A.groups[it[0]];
        rows.push([A.title, g.sev, g.kind, g.code, A.owners[it[1]].label, it[2], it[3], it[4], it[5], A.msgs[it[6]]]);
      });
      A.groups.forEach(function (g) {
        if (!typeMark(A, g) && g.kept < g.n) rows.push([A.title, g.sev, g.kind, g.code, '(' + (g.n - g.kept) + ' more items of this type)', '', '', '', '', 'Not listed individually - see FLY\'s migration report']);
      });
    });
    download(safeName + '_TechTeam_open_issues.csv', '﻿' + rows.map(function (r) { return r.map(q).join(','); }).join('\r\n'), 'text/csv');
  });

  // ---------- routing ----------
  function refresh() { route(true); }
  function route(keep) {
    var p = (location.hash || '#/').slice(2).split('/'), A = p[0] === 'a' ? byWl[p[1]] : null, view = p[2] || 'types';
    $('nav').innerHTML = navHtml(A ? A.id : '');
    var m = $('main'), prevQ = keep && $('q') ? $('q').value : '';
    if (!A) m.innerHTML = overview();
    else if (view === 'types') m.innerHTML = types(A);
    else if (view === 'users') m.innerHTML = users(A);
    else if (view === 'mappings') m.innerHTML = mappings(A);
    else {
      var filt = view === 'g' ? { g: +p[3] } : view === 'o' ? { o: +p[3] } : {};
      m.innerHTML = items(A, filt);
      if (prevQ) $('q').value = prevQ;
      ['q', 'sev', 'kind'].forEach(function (id) { $(id).addEventListener(id === 'q' ? 'input' : 'change', function () { fillItems(A, filt); }); });
      fillItems(A, filt);
    }
    if ((view === 'users' || view === 'mappings') && $('q')) {
      var applyQ = function () {
        var q = $('q').value.toLowerCase();
        Array.prototype.forEach.call($('rows').children, function (tr) { tr.style.display = !q || (tr.getAttribute('data-text') || '').indexOf(q) >= 0 ? '' : 'none'; });
      };
      if (prevQ) { $('q').value = prevQ; applyQ(); }
      $('q').addEventListener('input', applyQ);
    }
    // issue-type marks (types table rows and the item view's "whole issue type" bar)
    m.querySelectorAll('[data-g] select.tmark').forEach(function (s) {
      s.addEventListener('change', function () {
        var g = A.groups[+s.closest('[data-g]').getAttribute('data-g')];
        if (/^ignored/.test(s.value) && !typeMark(A, g)) { var why = prompt('Why is "' + (g.code || g.kind) + '" being ignored? (optional note, e.g. organiser is in another domain)', ''); setType(A, g, s.value); if (why) setNote(A, g, why); }
        else setType(A, g, s.value);
        changed(); var y = window.scrollY; refresh(); window.scrollTo(0, y);
      });
    });
    m.querySelectorAll('[data-g] input.tnote').forEach(function (inp) {
      inp.addEventListener('change', function () { setNote(A, A.groups[+inp.closest('[data-g]').getAttribute('data-g')], inp.value); });
    });
    m.querySelectorAll('.nogo').forEach(function (td) { td.addEventListener('click', function (e) { e.stopPropagation(); }); });
    m.querySelectorAll('tr[data-go]').forEach(function (tr) { tr.addEventListener('click', function (e) { if (!/^(A|SELECT|INPUT|OPTION)$/.test(e.target.tagName)) location.hash = tr.getAttribute('data-go'); }); });
    if (!keep) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function () { route(false); });
  route(false);
})();
</script>
</body>
</html>
